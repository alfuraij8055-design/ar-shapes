<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصمم الأشكال الهندسية AR</title>
<script>if(location.hash.indexOf('v=1')>-1)document.documentElement.className='viewer';</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efeae0;--fg:#1d1d1b;--panel:rgba(255,255,255,.92);--accent:#0f766e;--accent-fg:#fff;--border:#d6d0c2;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--fg:#f1efe9;--panel:rgba(30,34,38,.92);--accent:#2dd4bf;--accent-fg:#06201c;--border:#3a4046}}
:root[data-theme="dark"]{--bg:#15181b;--fg:#f1efe9;--panel:rgba(30,34,38,.92);--accent:#2dd4bf;--accent-fg:#06201c;--border:#3a4046}
*{box-sizing:border-box}
.viewer body{background:#000}.viewer #gl{visibility:hidden}.viewer #designer,.viewer #hint,.viewer #bar{display:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:absolute;left:0;right:0;padding:10px;pointer-events:none}
.top{top:0}.bot{bottom:0}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px;backdrop-filter:blur(8px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--border);border-radius:10px;padding:8px 6px;cursor:pointer}
button.on,button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.pri{padding:10px 14px;font-weight:600}
input[type=color]{width:42px;height:36px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px}
label{display:flex;gap:6px;align-items:center;font-size:14px}
.hint{pointer-events:none;text-align:center;font-size:13px;background:var(--panel);border-radius:12px;padding:8px 12px;margin:0 auto 8px;width:fit-content;max-width:92%}
#modal{position:absolute;inset:0;background:#fff;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
#modal .box{background:var(--panel);background-color:var(--bg);border-radius:18px;padding:6px;text-align:center;max-width:170px;width:100%;border:1px solid var(--border)}
#qr{background:#fff;padding:4px;border-radius:12px;display:inline-block}
#qr canvas,#qr img{position:static!important;inset:auto!important;width:110px!important;height:110px!important}
#lnk{font-size:11px;word-break:break-all;opacity:.7;margin:10px 0;direction:ltr;max-height:60px;overflow:auto}
#msg{font-size:13px;margin-top:6px;min-height:1em}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="gl"></canvas>

  <div class="ui top" id="designer">
    <div class="panel">
      <div class="shapes" id="shapes"></div>
      <div class="row">
        <label>اللون <input type="color" id="color" value="#0f9d8a"></label>
        <label><input type="checkbox" id="wire"> شبكة</label>
      </div>
    </div>
  </div>

  <div class="ui bot">
    <div class="hint" id="hint">اسحب بإصبع لتدوير الشكل، وبإصبعين للتكبير والتحريك</div>
    <div class="panel row" id="bar" style="justify-content:center">
      <button id="camBtn" class="pri">تشغيل الكاميرا</button>
      <button id="reset">إعادة ضبط</button>
      <button id="qrBtn" class="pri">إنشاء QR</button>
    </div>
    <div id="msg" style="text-align:center"></div>
  </div>

  <div id="modal"><div id="qr"></div></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var P=new URLSearchParams(location.hash.slice(1));
var viewer=P.get('v')==='1';
var state={s:P.get('s')||'cube',c:'#'+(P.get('c')||'0f9d8a'),w:P.get('w')==='1'};

var SHAPES={
  cube:['مكعب',function(){return new THREE.BoxGeometry(2,2,2)}],
  sphere:['كرة',function(){return new THREE.SphereGeometry(1.3,24,16)}],
  pyramid:['هرم',function(){return new THREE.ConeGeometry(1.6,2.4,4)}],
  cylinder:['أسطوانة',function(){return new THREE.CylinderGeometry(1,1,2.2,32)}],
  torus:['حلقة',function(){return new THREE.TorusGeometry(1.1,.4,16,40)}],
  octa:['ثماني',function(){return new THREE.OctahedronGeometry(1.5)}],
  dodeca:['اثنا عشري',function(){return new THREE.DodecahedronGeometry(1.4)}],
  icosa:['عشريني',function(){return new THREE.IcosahedronGeometry(1.4)}]
};
if(!SHAPES[state.s])state.s='cube';

/* three.js */
var canvas=$('gl'),stage=$('stage');
var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(50,1,.1,100);camera.position.z=6;
scene.add(new THREE.AmbientLight(0xffffff,.65));
var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,4);scene.add(dl);
var holder=new THREE.Group();scene.add(holder);
holder.rotation.set(.5,.6,0);
var mat=new THREE.MeshStandardMaterial({color:state.c,metalness:.2,roughness:.4,flatShading:true});
var mesh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat);
var edges=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffffff}));
holder.add(mesh);holder.add(edges);

function build(){
  var g=SHAPES[state.s][1]();
  mesh.geometry.dispose();mesh.geometry=g;
  edges.geometry.dispose();edges.geometry=new THREE.EdgesGeometry(g,20);
  mat.color.set(state.c);mat.wireframe=state.w;
  edges.visible=!state.w;
}
build();

function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();

/* touch / pointer control */
var ptrs=new Map(),last=null;
function info(){
  var a=Array.from(ptrs.values());
  if(a.length<2)return null;
  return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
}
canvas.addEventListener('pointerdown',function(e){
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});last=info();
});
canvas.addEventListener('pointermove',function(e){
  var p=ptrs.get(e.pointerId);if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    var q=new THREE.Quaternion().setFromEuler(new THREE.Euler(dy*.01,dx*.01,0));
    holder.quaternion.premultiply(q);
  }else if(ptrs.size>=2){
    var n=info();
    if(last){
      var s=holder.scale.x*(n.d/last.d);
      s=Math.max(.3,Math.min(4,s));holder.scale.setScalar(s);
      var k=2*Math.tan(camera.fov*Math.PI/360)*camera.position.z/stage.clientHeight;
      holder.position.x+=(n.x-last.x)*k;holder.position.y-=(n.y-last.y)*k;
    }
    last=n;
  }
});
function up(e){ptrs.delete(e.pointerId);last=info()}
canvas.addEventListener('pointerup',up);
canvas.addEventListener('pointercancel',up);

$('reset').onclick=function(){
  holder.quaternion.setFromEuler(new THREE.Euler(.5,.6,0));
  holder.position.set(0,0,0);holder.scale.setScalar(1);
};

/* camera */
async function startCam(){
  var m=$('msg');
  try{
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    var v=$('cam');v.srcObject=st;await v.play();v.style.display='block';canvas.style.visibility='visible';
    m.textContent='';$('camBtn').style.display='none';
  }catch(err){
    m.textContent='تعذر تشغيل الكاميرا. اسمح بالوصول للكاميرا ثم اضغط الزر.';
    if(viewer){$('bar').style.display='flex';$('reset').style.display='none'}
  }
}
$('camBtn').onclick=startCam;

/* designer UI */
if(viewer){
  $('designer').style.display='none';$('qrBtn').style.display='none';$('hint').style.display='none';$('bar').style.display='none';canvas.style.visibility='hidden';startCam();
}else{
  var box=$('shapes');
  Object.keys(SHAPES).forEach(function(k){
    var b=document.createElement('button');b.textContent=SHAPES[k][0];b.dataset.k=k;
    if(k===state.s)b.className='on';
    b.onclick=function(){
      state.s=k;build();
      Array.prototype.forEach.call(box.children,function(x){x.className=x.dataset.k===k?'on':''});
    };
    box.appendChild(b);
  });
  $('color').value=state.c;
  $('color').oninput=function(e){state.c=e.target.value;build()};
  $('wire').checked=state.w;
  $('wire').onchange=function(e){state.w=e.target.checked;build()};
  $('hint').textContent='جرّب الشكل هنا، ثم اضغط إنشاء QR لمشاركته';

  $('qrBtn').onclick=function(){
    var base=location.href.split('#')[0];
    var url=base+'#v=1&s='+state.s+'&c='+state.c.slice(1)+'&w='+(state.w?1:0);
    var q=$('qr');q.innerHTML='';
    try{new QRCode(q,{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent='تعذر إنشاء الرمز'}
        $('modal').style.display='flex';
  };
  $('modal').onclick=function(){$('modal').style.display='none'};
}
})();
</script>
</body>
</html>
